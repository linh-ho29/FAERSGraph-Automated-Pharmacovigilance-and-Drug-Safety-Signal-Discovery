[project]
name = "faersgraph"
version = "0.1.0"
description = "FAERSGraph: pharmacovigilance ingestion, provenance, and normalization pipeline over openFDA/FAERS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27,<0.29",
    "tenacity>=8.5,<10.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "typer>=0.12,<0.16",
    "rich>=13.7,<14.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<0.23",
    "freezegun>=1.5,<2.0",
    "ruff>=0.6,<0.14",
]

[project.scripts]
faersgraph = "faersgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faersgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
